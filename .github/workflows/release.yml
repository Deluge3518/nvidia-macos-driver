name: Release

# A tag v<version> publishes nullmoth-nvidia-<version>.tar.gz: the base package (BASE_VERSION, from BASE_REPO's release)
# with the NVAccel (macOS 15 and 26) and NVRMFB kexts this tree builds. The CHANGELOG section for <version> is the release text.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (it must already exist), e.g. v2.3.1'
        required: true

permissions:
  contents: write

env:
  BASE_REPO: nullmoth/nvidia-macos-driver
  BASE_VERSION: 2.3.1

jobs:
  build:
    uses: ./.github/workflows/build.yml

  release:
    needs: build
    runs-on: macos-15
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/download-artifact@v4
        with:
          name: kexts
          path: kx
      - name: Base package
        run: |
          gh release download "v$BASE_VERSION" -R "$BASE_REPO" -D base -p "nullmoth-nvidia-$BASE_VERSION.tar.gz" -p SHA256SUMS.txt
          (cd base && grep " nullmoth-nvidia-$BASE_VERSION.tar.gz\$" SHA256SUMS.txt | shasum -a 256 -c -)
      - name: Package
        run: |
          VER=${TAG#v}
          # the release text: this version's CHANGELOG section, else the base version's (a rebuild tag like
          # v2.3.1-custom has no section of its own; the changes are listed under the base version)
          if grep -q "^## $VER\$" CHANGELOG.md; then
            awk -v v="## $VER" '$0==v{on=1;next} on&&/^## /{exit} on' CHANGELOG.md > dist-body.md
          else
            grep -q "^## $BASE_VERSION\$" CHANGELOG.md || { echo "CHANGELOG.md has neither '## $VER' nor '## $BASE_VERSION'"; exit 1; }
            {
              awk -v v="## $BASE_VERSION" '$0==v{on=1;next} on&&/^## /{exit} on' CHANGELOG.md
              echo
              echo "> This is a rebuild of $BASE_VERSION: the CHANGELOG section above is the base release's;"
              echo "> NVAccel (macOS 15 and 26) and NVRMFB are rebuilt from this tree at \`$TAG\`."
            } > dist-body.md
          fi
          bash build/repack_release.sh "base/nullmoth-nvidia-$BASE_VERSION.tar.gz" kx "$VER" dist
          (cd dist && shasum -a 256 nullmoth-nvidia-$VER.tar.gz > SHA256SUMS.txt)
          {
            cat dist-body.md
            echo
            echo "### Install"
            echo '```'
            echo "tar -xzf nullmoth-nvidia-$VER.tar.gz && cd pkgroot"
            echo "sudo ./install.sh"
            echo '```'
            echo
            echo "Built by CI from \`$(git rev-parse --short HEAD)\`: NVAccel (macOS 15 and 26) and NVRMFB are rebuilt from this tree;"
            echo "NVRM, NVRMAGDC, the Metal userland and the GSP firmware are those of $BASE_REPO v$BASE_VERSION."
          } > dist/notes.md
          cat dist/notes.md
      - name: Publish
        run: |
          VER=${TAG#v}
          gh release create "$TAG" --verify-tag --title "Driver $VER" --notes-file dist/notes.md \
            "dist/nullmoth-nvidia-$VER.tar.gz" dist/SHA256SUMS.txt
