name: Release

# A tag v<version> publishes nullmoth-nvidia-<version>.tar.gz: the base package (BASE_VERSION, from BASE_REPO's release)
# with the NVAccel (macOS 15 and 26) and NVRMFB kexts this tree builds. The CHANGELOG section for <version> is the release text.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (it must already exist), e.g. v2.3.1'
        required: true

permissions:
  contents: write

env:
  BASE_REPO: nullmoth/nvidia-macos-driver
  BASE_VERSION: 2.3.1

jobs:
  build:
    uses: ./.github/workflows/build.yml

  release:
    needs: build
    runs-on: macos-15
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/download-artifact@v4
        with:
          name: kexts
          path: kx
      - name: Base package
        run: |
          gh release download "v$BASE_VERSION" -R "$BASE_REPO" -D base -p "nullmoth-nvidia-$BASE_VERSION.tar.gz" -p SHA256SUMS.txt
          (cd base && grep " nullmoth-nvidia-$BASE_VERSION.tar.gz\$" SHA256SUMS.txt | shasum -a 256 -c -)
      - name: Package
        run: |
          VER=${TAG#v}
          grep -q "^## $VER\$" CHANGELOG.md || { echo "CHANGELOG.md has no '## $VER' section"; exit 1; }
          bash build/repack_release.sh "base/nullmoth-nvidia-$BASE_VERSION.tar.gz" kx "$VER" dist
          (cd dist && shasum -a 256 nullmoth-nvidia-$VER.tar.gz > SHA256SUMS.txt)
          {
            awk -v v="## $VER" '$0==v{on=1;next} on&&/^## /{exit} on' CHANGELOG.md
            echo
            echo "### Install"
            echo '```'
            echo "tar -xzf nullmoth-nvidia-$VER.tar.gz && cd pkgroot"
            echo "sudo ./install.sh"
            echo '```'
            echo
            echo "Built by CI from \`$(git rev-parse --short HEAD)\`: NVAccel (macOS 15 and 26) and NVRMFB are rebuilt from this tree;"
            echo "NVRM, NVRMAGDC, the Metal userland and the GSP firmware are those of $BASE_REPO v$BASE_VERSION."
          } > dist/notes.md
          cat dist/notes.md
      - name: Publish
        run: |
          VER=${TAG#v}
          gh release create "$TAG" --verify-tag --title "Driver $VER" --notes-file dist/notes.md \
            "dist/nullmoth-nvidia-$VER.tar.gz" dist/SHA256SUMS.txt
